name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --immutable
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4001
